<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>المباريات - El7amla Fantasy League</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;

      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;

      --blue-accent: #3b82f6;
      --blue-dark: #1d4ed8;

      --gold: #fbbf24;
      --green: #22c55e;
      --red: #ef4444;

      --nav-h: 68px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      direction: rtl;
    }

    /* =========================
       NAVBAR
    ========================= */

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: var(--nav-h);

      background: rgba(15, 23, 42, .96);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);

      z-index: 1000;

      display: flex;
      align-items: center;

      padding: 0 20px;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;

      display: flex;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;

      margin-left: auto;

      flex-shrink: 0;
    }

    .logo-mark {
      width: 44px;
      height: 44px;

      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #3b82f6,
          #60a5fa
        );

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 0 18px rgba(59,130,246,.4);

      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 26px;
      height: 26px;

      fill: none;
      stroke: #fff;

      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-ar {
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;

      color: var(--text-primary);
    }

    .logo-en {
      font-family: 'Orbitron', sans-serif;

      font-size: .5rem;
      font-weight: 700;

      color: var(--blue-accent);

      letter-spacing: 2.5px;

      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;

      margin-right: auto;
    }

    .nav-links a {
      color: var(--text-muted);

      text-decoration: none;

      font-size: .9rem;
      font-weight: 600;

      padding: 8px 18px;

      border-bottom: 3px solid transparent;

      transition: .2s;

      height: var(--nav-h);

      display: flex;
      align-items: center;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue-accent);

      border-bottom-color: var(--blue-accent);

      background: rgba(59,130,246,.06);
    }

    .hamburger {
      display: none;

      flex-direction: column;

      gap: 5px;

      cursor: pointer;

      padding: 4px;

      margin-right: auto;

      background: none;

      border: none;
    }

    .hamburger span {
      display: block;

      width: 24px;
      height: 2px;

      background: var(--text-primary);

      border-radius: 2px;
    }

    /* =========================
       PAGE
    ========================= */

    .page-wrap {
      max-width: 1200px;

      margin: 0 auto;

      padding:
        calc(var(--nav-h) + 28px)
        16px
        60px;
    }

    .page-header {
      text-align: center;

      margin-bottom: 28px;
    }

    .page-title {
      font-family: 'Orbitron', sans-serif;

      font-size:
        clamp(1.1rem, 3.5vw, 1.9rem);

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #60a5fa,
          #f1f5f9,
          #60a5fa
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;

      margin-bottom: 4px;
    }

    .page-sub {
      font-size: .85rem;

      color: var(--text-muted);

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    /* =========================
       GW GRID
    ========================= */

    .gw-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(56px, 1fr));

      gap: 7px;

      background: var(--bg-card);

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 24px;

      box-shadow:
        0 4px 24px rgba(0,0,0,.35);
    }

    .gw-btn {
      font-family: 'Orbitron', sans-serif;

      font-size: .72rem;
      font-weight: 700;

      padding: 8px 4px;

      border-radius: 8px;

      border: 1px solid var(--border);

      background: var(--bg-primary);

      color: var(--text-muted);

      cursor: pointer;

      text-align: center;

      transition: .2s;

      position: relative;
    }

    .gw-btn:hover {
      border-color: var(--blue-accent);

      color: var(--blue-accent);

      background: rgba(59,130,246,.07);
    }

    .gw-btn.played {
      border-color: rgba(34,197,94,.3);

      color: rgba(34,197,94,.8);
    }

    .gw-btn.current {
      border-color: var(--gold);

      color: var(--gold);

      box-shadow:
        0 0 8px rgba(251,191,36,.25);
    }

    .gw-btn.active {
      background: var(--blue-accent) !important;

      border-color: var(--blue-accent) !important;

      color: #fff !important;

      box-shadow:
        0 0 12px rgba(59,130,246,.4);
    }

    .gw-btn.played::after {
      content: '';

      position: absolute;

      top: 4px;
      left: 50%;

      transform: translateX(-50%);

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: var(--green);
    }

    .gw-btn.active::after {
      display: none;
    }

    /* =========================
       PANEL
    ========================= */

    .gw-panel {
      background: var(--bg-card);

      border: 1px solid var(--border);

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 4px 24px rgba(0,0,0,.4);
    }

    .gw-panel-hdr {
      padding: 14px 20px;

      background:
        linear-gradient(
          90deg,
          #1d4ed8,
          #2563eb
        );

      display: flex;

      align-items: center;

      justify-content: space-between;

      font-weight: 800;

      font-size: .92rem;
    }

    .gw-panel-body {
      padding: 18px;
    }

    /* =========================
       MATCH CARD
    ========================= */

    .fix-card {
      background: var(--bg-primary);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 18px 16px;

      margin-bottom: 10px;

      transition:
        border-color .2s,
        transform .2s;
    }

    .fix-card:last-child {
      margin-bottom: 0;
    }

    .fix-card:hover {
      border-color: var(--blue-accent);

      transform: translateY(-2px);
    }

    .fix-card.bye-fix {
      opacity: .55;

      border-style: dashed;
    }

    .fix-card.win-home {
      border-right: 3px solid var(--green);
    }

    .fix-card.win-away {
      border-left: 3px solid var(--green);
    }

    .fix-card.draw-match {
      border-color: rgba(251,191,36,.45);
    }

    .fix-row {
      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      gap: 14px;
    }

    .fix-team {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      text-align: center;
    }

    .fix-icon {
      width: 58px;
      height: 58px;

      border-radius: 14px;

      background: var(--bg-card);

      border: 2px solid var(--border);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 2.1rem;

      transition: border-color .2s;
    }

    .fix-card:hover .fix-icon {
      border-color: var(--blue-accent);
    }

    .fix-name {
      font-weight: 800;

      font-size: .92rem;
    }

    .fix-role {
      font-size: .72rem;

      color: var(--text-muted);
    }

    /* =========================
       SCORE
    ========================= */

    .fix-score {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 7px;

      min-width: 130px;
    }

    .fix-nums {
      font-family: 'Orbitron', sans-serif;

      font-size: 1.7rem;

      font-weight: 900;

      letter-spacing: 2px;

      direction: ltr;

      white-space: nowrap;
    }

    .score-home {
      color: var(--text-primary);
    }

    .score-away {
      color: var(--text-primary);
    }

    .score-winner {
      color: var(--green) !important;

      text-shadow:
        0 0 10px rgba(34,197,94,.25);
    }

    .score-loser {
      color: var(--red) !important;
    }

    .score-draw {
      color: var(--gold) !important;
    }

    .fix-tag {
      font-size: .66rem;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      padding: 2px 10px;

      border-radius: 10px;
    }

    .fix-tag.done {
      background: rgba(34,197,94,.15);

      color: var(--green);
    }

    .fix-tag.live {
      background: rgba(251,191,36,.15);

      color: var(--gold);

      animation: pulse 1.4s infinite;
    }

    .fix-tag.soon {
      background: rgba(59,130,246,.15);

      color: var(--blue-accent);
    }

    .fix-tag.bye {
      background: rgba(100,116,139,.15);

      color: var(--text-muted);
    }

    .result-label {
      font-size: .67rem;

      color: var(--text-muted);

      margin-top: -2px;
    }

    /* =========================
       BYE
    ========================= */

    .full-bye {
      padding: 48px 20px;

      text-align: center;

      color: var(--text-muted);
    }

    .full-bye .bi {
      font-size: 2.5rem;

      margin-bottom: 12px;
    }

    /* =========================
       STATE
    ========================= */

    .state-box {
      text-align: center;

      padding: 48px 20px;

      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;

      border: 3px solid rgba(59,130,246,.2);

      border-top-color: var(--blue-accent);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin: 0 auto 12px;
    }

    /* =========================
       META
    ========================= */

    .meta-footer {
      margin-top: 32px;

      display: flex;

      flex-wrap: wrap;

      gap: 14px;

      justify-content: center;
    }

    .meta-chip {
      background: var(--bg-card);

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 9px 18px;

      font-size: .81rem;

      color: var(--text-muted);

      display: flex;

      align-items: center;

      gap: 7px;
    }

    .meta-chip span {
      color: var(--text-primary);

      font-weight: 700;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(1.3);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation:
        fadeUp .25s ease forwards;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      .nav-links {
        display: none;

        flex-direction: column;

        position: fixed;

        top: var(--nav-h);

        left: 0;
        right: 0;

        background:
          rgba(15,23,42,.97);

        border-bottom:
          1px solid var(--border);

        padding: 10px 16px 18px;

        z-index: 999;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        height: auto;

        padding: 11px 14px;

        border-bottom: none;

        border-radius: 8px;

        width: 100%;
      }

      .nav-links a.active {
        background:
          rgba(59,130,246,.12);
      }

      .hamburger {
        display: flex;
      }

      .fix-nums {
        font-size: 1.35rem;

        letter-spacing: 1px;
      }

      .fix-icon {
        width: 46px;
        height: 46px;

        font-size: 1.6rem;
      }

      .fix-score {
        min-width: 95px;
      }
    }

    @media (max-width: 480px) {

      .gw-grid {
        grid-template-columns:
          repeat(auto-fill, minmax(46px,1fr));

        gap: 5px;

        padding: 12px;
      }

      .gw-btn {
        font-size: .65rem;

        padding: 7px 2px;
      }

      .fix-row {
        gap: 5px;
      }

      .fix-name {
        font-size: .78rem;
      }

      .fix-nums {
        font-size: 1.15rem;
      }

      .fix-score {
        min-width: 75px;
      }
    }
  </style>
</head>

<script>

/* =========================================================
   TEAM META
========================================================= */

const TEAM_META = {

  "Black Tech": {
    color: "#a855f7",
    em: "💻"
  },

  "The Pharaohs": {
    color: "#eab308",
    em: "🏺"
  },

  "Falcons": {
    color: "#3b82f6",
    em: "🦅"
  },

  "Boys": {
    color: "#f97316",
    em: "⚽"
  },

  "Royal Authority": {
    color: "#ef4444",
    em: "👑"
  },

  "The Masterminds": {
    color: "#06b6d4",
    em: "🧠"
  },

  "الزرازير": {
    color: "#8b5cf6",
    em: "🦇"
  },

  "الاوديسي": {
    color: "#10b981",
    em: "🌌"
  },

  "Smokers": {
    color: "#22c55e",
    em: "💨"
  }

};


/* =========================================================
   GLOBAL DATA
========================================================= */

let fixtures = {};

let standingsData = {};

let currentGW = 1;

let selectedGW = null;


/*
  Cache for GW history.

  Example:

  gwHistory[1] = {
    "Black Tech": {
      "12345": {
        points: 75
      }
    }
  }
*/

const gwHistory = {};


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON(url) {

  const response = await fetch(
    `${url}?v=${Date.now()}`
  );

  if (!response.ok) {
    throw new Error(
      `Failed loading ${url}`
    );
  }

  return response.json();
}


/* =========================================================
   LOAD FIXTURES
========================================================= */

async function loadFixtures() {

  /*
    IMPORTANT:

    Your real fixtures.json is in the ROOT:

      ./fixtures.json

    So we try that FIRST.

    Only if it doesn't exist, we try:

      ./data/fixtures.json
  */

  try {

    const data = await loadJSON(
      "./fixtures.json"
    );

    console.log(
      "Fixtures loaded from ./fixtures.json"
    );

    return data.fixtures || data;

  } catch (e) {

    console.warn(
      "Root fixtures.json not found."
    );

  }


  try {

    const data = await loadJSON(
      "./data/fixtures.json"
    );

    console.log(
      "Fixtures loaded from ./data/fixtures.json"
    );

    return data.fixtures || data;

  } catch (e) {

    console.error(
      "Could not load fixtures.json",
      e
    );

    return {};

  }

}


/* =========================================================
   LOAD GW HISTORY
========================================================= */

async function loadGWHistory(gw) {

  if (gwHistory[gw]) {
    return gwHistory[gw];
  }

  try {

    const data = await loadJSON(
      `./data/gw_history/gw${gw}.json`
    );

    gwHistory[gw] = data;

    return data;

  } catch (e) {

    console.warn(
      `GW${gw} history not found`
    );

    gwHistory[gw] = null;

    return null;
  }

}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    /*
      Load standings and fixtures.
    */

    const [
      standingsRes,
      fixturesRes
    ] = await Promise.all([

      loadJSON(
        "./data/current_standings.json"
      ).catch(() => ({})),

      loadFixtures()

    ]);


    standingsData = standingsRes || {};

    fixtures = fixturesRes || {};


    /*
      Current GW comes from standings.
    */

    currentGW =
      Number(
        standingsData.current_gw
      ) || 1;


    /*
      Number of actual fixture rounds.

      Your fixtures.json contains 35 rounds.
    */

    const availableGWs =
      Object.keys(fixtures)
        .map(Number)
        .filter(Number.isFinite);

    const maxGW =
      availableGWs.length
        ? Math.max(...availableGWs)
        : 35;


    /*
      Metadata
    */

    document.getElementById(
      "meta-gw"
    ).textContent = currentGW;

    document.getElementById(
      "meta-updated"
    ).textContent =
      standingsData.last_updated || "—";

    document.getElementById(
      "meta-footer"
    ).style.display = "flex";


    /*
      Update subtitle dynamically.
    */

    document.querySelector(
      ".page-sub"
    ).textContent =
      `${maxGW} جولة — الموسم 2025 / 26`;


    /*
      Build buttons.
    */

    buildGrid(maxGW);


    /*
      Open current GW.
    */

    selectGW(currentGW);

  } catch (e) {

    console.error(e);

    document.getElementById(
      "panel-body"
    ).innerHTML = `

      <div class="state-box">

        <div style="font-size:2rem">
          ⚠️
        </div>

        <p>
          فشل تحميل البيانات
        </p>

      </div>

    `;

  }

}


/* =========================================================
   BUILD GW GRID
========================================================= */

function buildGrid(maxGW) {

  const grid =
    document.getElementById(
      "gw-grid"
    );

  let html = "";


  for (
    let gw = 1;
    gw <= maxGW;
    gw++
  ) {

    /*
      GW < current = finished
      GW == current = current
      GW > current = upcoming
    */

    const played =
      gw < currentGW;

    const isCurrent =
      gw === currentGW;


    let cls = "gw-btn";


    if (played) {
      cls += " played";
    }

    if (isCurrent) {
      cls += " current";
    }


    html += `

      <button
        class="${cls}"
        id="gwb-${gw}"
        onclick="selectGW(${gw})"
      >
        ${gw}
      </button>

    `;

  }


  grid.innerHTML = html;

}


/* =========================================================
   SELECT GW
========================================================= */

function selectGW(gw) {

  if (selectedGW) {

    const old =
      document.getElementById(
        `gwb-${selectedGW}`
      );

    if (old) {
      old.classList.remove(
        "active"
      );
    }

  }


  selectedGW = gw;


  const btn =
    document.getElementById(
      `gwb-${gw}`
    );


  if (btn) {
    btn.classList.add("active");
  }


  renderGW(gw);

}


/* =========================================================
   GET MATCHUPS
========================================================= */

function getMatchups(gw) {

  /*
    JSON keys are strings.

    Example:

      "1": [...]
      "2": [...]
  */

  return (
    fixtures[String(gw)] ||
    fixtures[gw] ||
    []
  );

}


/* =========================================================
   GET PLAYER POINTS FROM GW HISTORY
========================================================= */

function getTeamGWPoints(
  team,
  gw,
  history
) {

  if (!history) {
    return null;
  }


  const teamData =
    history[team];


  if (!teamData) {
    return null;
  }


  let total = 0;


  Object.values(
    teamData
  ).forEach(player => {

    if (
      player &&
      typeof player.points === "number"
    ) {

      total += player.points;

    }

  });


  return total;

}


/* =========================================================
   FORMAT SCORE
========================================================= */

function formatScore(
  homePts,
  awayPts
) {

  return `
    <span
      class="${
        homePts > awayPts
          ? "score-winner"
          : homePts < awayPts
            ? "score-loser"
            : "score-draw"
      }"
    >
      ${homePts}
    </span>

    <span style="color:var(--text-muted)">
      -
    </span>

    <span
      class="${
        awayPts > homePts
          ? "score-winner"
          : awayPts < homePts
            ? "score-loser"
            : "score-draw"
      }"
    >
      ${awayPts}
    </span>
  `;

}


/* =========================================================
   RENDER GW
========================================================= */

async function renderGW(gw) {

  const matchups =
    getMatchups(gw);


  const played =
    gw < currentGW;

  const isCurrent =
    gw === currentGW;


  const statusLabel =
    isCurrent
      ? "جارية الآن"
      : played
        ? "انتهت"
        : "قادمة";


  const statusTag =
    isCurrent
      ? "live"
      : played
        ? "done"
        : "soon";


  document.getElementById(
    "panel-title"
  ).textContent =
    `الجولة ${gw}`;


  document.getElementById(
    "panel-status"
  ).innerHTML = `

    <span
      class="fix-tag ${statusTag}"
    >
      ${statusLabel}
    </span>

  `;


  /*
    IMPORTANT FIX:

    Do NOT show "لا توجد مباريات"
    just because GW history isn't available.

    Fixtures can exist even when
    GW hasn't been played yet.
  */

  if (
    !matchups ||
    matchups.length === 0
  ) {

    document.getElementById(
      "panel-body"
    ).innerHTML = `

      <div class="state-box">

        <div style="font-size:2rem">
          📭
        </div>

        <p>
          لا توجد مباريات معلنة لهذه الجولة
        </p>

      </div>

    `;

    return;
  }


  /*
    Load GW history only when useful.

    For finished GWs:
      we need scores.

    For current/upcoming:
      history may not exist.
  */

  let history = null;


  if (played) {

    history =
      await loadGWHistory(gw);

  }


  /*
    Check full BYE.
  */

  const allBye =
    matchups.every(
      m =>
        m[0] === "BYE" &&
        m[1] === "BYE"
    );


  if (allBye) {

    document.getElementById(
      "panel-body"
    ).innerHTML = `

      <div class="full-bye fade-up">

        <div class="bi">
          😴
        </div>

        <div
          style="
            font-weight:800;
            font-size:1rem;
            margin-bottom:6px
          "
        >
          جولة راحة كاملة
        </div>

        <div
          style="font-size:.85rem"
        >
          لا توجد مباريات في هذه الجولة
        </div>

      </div>

    `;

    return;

  }


  /*
    Render matches.
  */

  const cards = [];


  for (
    const m of matchups
  ) {

    const home =
      m[0] || m.home;

    const away =
      m[1] || m.away;


    /*
      BYE
    */

    if (
      home === "BYE" ||
      away === "BYE"
    ) {

      const team =
        home === "BYE"
          ? away
          : home;


      const meta =
        TEAM_META[team] || {
          em: "⚽",
          color: "#64748b"
        };


      cards.push(`

        <div
          class="fix-card bye-fix fade-up"
        >

          <div class="fix-row">

            <div class="fix-team">

              <div
                class="fix-icon"
                style="
                  border-color:${meta.color}
                "
              >
                ${meta.em}
              </div>

              <div class="fix-name">
                ${team}
              </div>

            </div>


            <div class="fix-score">

              <div
                class="fix-nums"
                style="
                  font-size:1rem;
                  color:var(--text-muted)
                "
              >
                BYE
              </div>

              <div class="fix-tag bye">
                راحة
              </div>

            </div>


            <div class="fix-team"></div>

          </div>

        </div>

      `);

      continue;
    }


    /*
      TEAM META
    */

    const hMeta =
      TEAM_META[home] || {
        em: "⚽",
        color: "#64748b"
      };


    const aMeta =
      TEAM_META[away] || {
        em: "⚽",
        color: "#64748b"
      };


    /*
      Get scores.

      For a finished GW, read:
        data/gw_history/gwX.json

      For upcoming/current:
        no score yet.
    */

    let homePts = null;
    let awayPts = null;


    if (history) {

      homePts =
        getTeamGWPoints(
          home,
          gw,
          history
        );

      awayPts =
        getTeamGWPoints(
          away,
          gw,
          history
        );

    }


    /*
      Has a valid result?
    */

    const hasScore =
      homePts !== null &&
      awayPts !== null;


    let cardClass =
      "fix-card fade-up";


    let scoreHTML = "";


    let resultHTML = "";


    if (hasScore) {

      /*
        Determine winner/draw.
      */

      if (homePts > awayPts) {

        cardClass +=
          " win-home";

        resultHTML = `
          <div class="result-label">
            🏆 فوز ${home}
          </div>
        `;

      }

      else if (awayPts > homePts) {

        cardClass +=
          " win-away";

        resultHTML = `
          <div class="result-label">
            🏆 فوز ${away}
          </div>
        `;

      }

      else {

        cardClass +=
          " draw-match";

        resultHTML = `
          <div class="result-label">
            🤝 تعادل
          </div>
        `;

      }


      scoreHTML = `

        <div class="fix-nums">
          ${formatScore(
            homePts,
            awayPts
          )}
        </div>

        <div class="fix-tag done">
          انتهت
        </div>

        ${resultHTML}

      `;

    }

    else {

      /*
        Upcoming/current fixture.
      */

      scoreHTML = `

        <div
          class="fix-nums"
          style="
            color:var(--text-muted);
            font-size:1.2rem
          "
        >
          VS
        </div>

        <div
          class="fix-tag ${statusTag}"
        >
          ${statusLabel}
        </div>

      `;

    }


    cards.push(`

      <div class="${cardClass}">

        <div class="fix-row">

          <!-- HOME -->

          <div class="fix-team">

            <div
              class="fix-icon"
              style="
                border-color:${hMeta.color}
              "
            >
              ${hMeta.em}
            </div>

            <div class="fix-name">
              ${home}
            </div>

            <div class="fix-role">
              مستضيف
            </div>

          </div>


          <!-- SCORE -->

          <div class="fix-score">

            ${scoreHTML}

          </div>


          <!-- AWAY -->

          <div class="fix-team">

            <div
              class="fix-icon"
              style="
                border-color:${aMeta.color}
              "
            >
              ${aMeta.em}
            </div>

            <div class="fix-name">
              ${away}
            </div>

            <div class="fix-role">
              الضيف
            </div>

          </div>

        </div>

      </div>

    `);

  }


  document.getElementById(
    "panel-body"
  ).innerHTML =
    cards.join("");

}


/* =========================================================
   START
========================================================= */

init();

</script>

</html>
