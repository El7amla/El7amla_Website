name: Update Standings

on:
  schedule:
    # Backup only. The Cloudflare Worker will trigger this every minute
    # during matches (next step); this keeps the site fresh if it is down.
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      full_recompute:
        description: "Recompute ALL gameweeks from FPL (use if a chip/transfer changed for an old GW)"
        type: boolean
        default: false

# Never run two updates at once; a second run waits instead of being cancelled.
concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run standings updater
        env:
          FULL_RECOMPUTE: ${{ inputs.full_recompute && '1' || '0' }}
        run: python scripts/update_standings.py

      - name: Commit and push updated standings
        run: |
          git config user.name "El7amla Bot"
          git config user.email "bot@el7amla.local"

          git add data/current_standings.json
          git add data/gw_history/
          git add data/gw_lineups/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update standings [skip ci]"

          for i in 1 2 3 4; do
            if git push origin main; then
              echo "Push successful"
              exit 0
            fi
            echo "Push failed (attempt $i) — syncing with latest main and retrying..."
            git fetch --depth=20 origin main
            git rebase -X theirs origin/main
            sleep 2
          done

          echo "Could not push after retries"
          exit 1
