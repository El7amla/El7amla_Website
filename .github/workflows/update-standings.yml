name: Update Standings

on:
  # FIXED: was "0 23 * * *" (once a day, 1 AM Cairo time), which meant
  # a gameweek that kicked off in the afternoon wouldn't get picked up
  # until the middle of the night, even after update_standings.py was
  # fixed to detect in-progress gameweeks. Running every 2 hours means
  # the site catches up with a live/in-progress gameweek within a
  # couple of hours of its deadline passing, instead of up to a full
  # day later.
  schedule:
    - cron: "0 */2 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push current_standings.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so rebase works correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run standings updater
        run: python scripts/update_standings.py

      - name: Commit and push updated standings
        run: |
          git config user.name  "El7amla Bot"
          git config user.email "bot@el7amla.local"
          # IMPORTANT: data/gw_lineups/ must be staged too, otherwise the
          # lineup JSON files generated by update_standings.py are created
          # inside the runner's workspace but never committed — they just
          # get thrown away when the job finishes, and teams.html then
          # gets a 404 when it tries to fetch them.
          git add data/current_standings.json data/gw_history/ data/gw_lineups/
          # Only commit if there are actual changes
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update standings [skip ci]"
          # Pull latest remote changes with rebase to avoid conflicts
          git pull --rebase origin main
          git push origin main
