name: Update Standings

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Make sure the runner starts from the latest main
      # BEFORE generating any files.
      - name: Sync with latest main
        run: |
          git config user.name "El7amla Bot"
          git config user.email "bot@el7amla.local"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Run standings updater
        run: python scripts/update_standings.py

      - name: Commit and push updated standings
        run: |
          git config user.name "El7amla Bot"
          git config user.email "bot@el7amla.local"

          # Stage generated standings/history/lineups
          git add data/current_standings.json
          git add data/gw_history/
          git add data/gw_lineups/

          # Stop successfully if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update standings [skip ci]"

          # Try to push
          if git push origin main; then
            echo "Push successful"
            exit 0
          fi

          echo "Push failed because main changed while the job was running."
          echo "Syncing with latest main and retrying..."

          git fetch origin main

          # Rebase the generated update on top of the latest main.
          # For generated files, keep the updater's version if conflicts occur.
          git rebase -X theirs origin/main

          git push origin main
